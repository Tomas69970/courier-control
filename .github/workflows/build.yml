name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/CourierControl-2.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CourierControl-APK
          path: out/*.apk

      - name: Publish release (download on phone)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.0.${{ github.run_number }}" out/*.apk \
            --title "Courier Control 2.0.${{ github.run_number }}" \
            --notes "Automatický build z commitu ${GITHUB_SHA::7}. Stáhni APK v telefonu a nainstaluj." \
            --latest
